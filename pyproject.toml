[project]
name = "cloudimg-seeder"
version = "0.2.0"
description = "Seeds cloud-init into any cloud image via headless QEMU"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.27.1",
    "qemu.qmp>=0.0.6",
    "pycdlib>=1.20.0",
]

[project.scripts]
cloudimg-seeder = "cloudimg_seeder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudimg_seeder"]

[tool.pyrefly]
python-version = "3.11"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
min-severity = "warn"
preset = "strict"
project-excludes = ["**/temp"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["temp"]

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "ARG", # flake8-unused-arguments
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
# Every subprocess call in this tool uses a literal argv list, never
# shell=True or interpolated strings; S603's blanket "review this call"
# has no signal left to give here.
ignore = ["S603"]

[tool.ruff.lint.per-file-ignores]
# Tests assert on purpose and implement fakes whose signatures must match
# the Protocol they stand in for even when a given fake does not use every
# parameter.
"tests/**" = ["S101", "ARG001", "ARG002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
