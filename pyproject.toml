[project]
name = "cloudimg-seeder"
version = "0.2.0"
description = "Seeds cloud-init into any cloud image via headless QEMU"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.27.1",
    "qemu.qmp>=0.0.6",
    "pycdlib>=1.20.0",
]

[project.scripts]
cloudimg-seeder = "cloudimg_seeder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudimg_seeder"]

[tool.pyrefly]
python-version = "3.11"
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
min-severity = "warn"
preset = "strict"
project-excludes = ["**/temp"]

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["temp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
]
